name: Deploy OTA Update to Production

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'OTA_UPDATES_GUIDE.md'
      - '.gitignore'

jobs:
  typecheck_and_deploy:
    name: Typecheck and Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Verification
        run: npx tsc --noEmit

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📲 Publish Over-The-Air (OTA) Update
        run: |
          npx eas-cli update --branch production --message "Automated update from commit ${{ github.sha }}" --non-interactive

