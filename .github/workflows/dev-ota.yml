name: Dev - Publish OTA Update

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'OTA_UPDATES_GUIDE.md'
      - '.gitignore'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ota_update:
    name: Typecheck & Publish Dev OTA
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Verification
        run: npx tsc --noEmit

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📲 Publish Dev OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch dev --message "Dev OTA: ${{ github.event.head_commit.message || github.sha }}" --non-interactive
