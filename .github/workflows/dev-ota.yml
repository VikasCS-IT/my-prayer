name: Dev - Publish OTA Update

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'OTA_UPDATES_GUIDE.md'
      - '.gitignore'

jobs:
  ota_update:
    name: Typecheck & Publish Dev OTA
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Verification
        run: npx tsc --noEmit

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📲 Publish Dev OTA Update
        run: |
          npx eas-cli update --branch dev --message "Dev OTA: ${{ github.event.head_commit.message || github.sha }}" --non-interactive

